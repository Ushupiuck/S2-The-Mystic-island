name: Windows sound build

on:
  push:
    branches: [test/rebuilt-kehmusic, Mystic-Island]
    paths:
      - .github/workflows/windows-sound-build.yml
      - build.bat
      - build.lua
      - build_tools/lua/**
      - build_tools/sound/build.py
      - build_tools/sound/**/*.cs
      - build_tools/check_sound_tools.py
      - build_tools/Windows-*/**
      - _definitions/**
      - sound/*.gen.asm
      - KEHmusic.exe
      - KEHsfx.exe
      - '*.dll'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
        working-directory: Windows build check
    steps:
      - uses: actions/checkout@v7
        with:
          path: Windows build check
      - name: Build ROM with distributed sound tools
        run: build_tools\lua\lua.exe build.lua
      - name: Rebuild and check sound tools
        run: python build_tools\sound\build.py --check
      - name: Build ROM with rebuilt sound tools
        run: build_tools\lua\lua.exe build.lua
